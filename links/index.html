    <script>
        document.querySelectorAll('.link-row[data-copy]').forEach(row => {
            const arrow = row.querySelector('.link-arrow');
            const original = arrow.textContent;

            row.addEventListener('click', async () => {
                const value = row.dataset.copy;
                try {
                    await navigator.clipboard.writeText(value);
                } catch (error) {
                    const helper = document.createElement('textarea');
                    helper.value = value;
                    document.body.appendChild(helper);
                    helper.select();
                    document.execCommand('copy');
                    helper.remove();
                }

                arrow.textContent = 'copied';
                row.classList.add('is-copied');
                setTimeout(() => {
                    arrow.textContent = original;
                    row.classList.remove('is-copied');
                }, 1600);
            });
        });

        const snowfall = document.querySelector('.snowfall');

        for (let i = 0; i < 50; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.style.left = `${Math.random() * 100}vw`;
            snowflake.style.animationDuration = `${Math.random() * 4 + 6}s`;
            snowflake.style.animationDelay = `${Math.random() * 5}s`;
            snowfall.appendChild(snowflake);
        }

        document.addEventListener('mousemove', (event) => {
            const mouseX = event.clientX;

            document.querySelectorAll('.snowflake').forEach((snowflake) => {
                const snowflakeX = parseFloat(snowflake.style.left);
                const distanceX = mouseX - snowflakeX;

                snowflake.style.animationTimingFunction = 'linear';
                snowflake.style.transform = `translateX(${(distanceX / 50)}px)`;
            });
        });
    </script>
